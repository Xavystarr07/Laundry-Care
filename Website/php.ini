; ══════════════════════════════════════════════════════
; Laundry Care — php.ini
; Place this file in your Website/ root folder.
; Required because InfinityFree ignores php_value in
; .htaccess — this file is the correct way to set PHP
; configuration on InfinityFree hosting.
; ══════════════════════════════════════════════════════

; Hide PHP errors from visitors (attackers use error messages to probe)
display_errors = Off
display_startup_errors = Off

; Log errors to server log instead (you can view in InfinityFree control panel)
log_errors = On
error_reporting = E_ALL

; Hide PHP version from HTTP headers
expose_php = Off

; Execution limits (prevents runaway scripts / timeout attacks)
max_execution_time = 30
max_input_time = 30
memory_limit = 64M

; Upload / POST limits (prevents form bomb attacks)
post_max_size = 10M
upload_max_filesize = 2M
max_input_vars = 500

; Session security
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.cookie_samesite = Strict

; Disable dangerous PHP functions
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
